[package]
name = "self-planner"
version = "0.0.0"
description = "Private, offline-first planner for ADHD brains"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "self_planner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "self-planner"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
refinery = { version = "0.10.0", features = ["rusqlite"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
thiserror = "2.0.21"
uuid = { version = "1.28.0", features = ["v7"] }

[dev-dependencies]
tempfile = "3.27.0"
